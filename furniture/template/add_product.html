<!-- Add Product Section -->
<!--<div class="container mt-5">-->
    <div class="container mt-5" style="background-color: #3b5d50; border-radius: 10px; padding: 20px;">

  <div class="row justify-content-center">
    <div class="col-md-6">  <!-- Reduce width here -->
      <div class="card p-4 shadow-sm">
        <h4 class="text-center mb-4">Add Product</h4>

        <form id="addProductForm" method="POST" action="addproduct" enctype="multipart/form-data">
          {% csrf_token %}

          <!-- Category -->
          <div class="mb-3">
            <label for="category" class="form-label">Select Category</label>
            <select class="form-select" id="category" name="category" required>
              <option value="">-- Select Category --</option>
              <option value="storage">Storage Devices</option>
              <option value="cables">Cables</option>
              <option value="motherboard">Motherboards</option>
              <option value="processor">Processors</option>
              <option value="ram">RAM</option>
              <option value="gpu">Graphics Cards</option>
              <option value="peripheral">Peripherals</option>
              <option value="others">Others</option>
            </select>
          </div>

          <!-- Common Fields -->
          <div id="commonFields">
            <div class="mb-3">
              <label for="productName" class="form-label">Product Name</label>
              <input type="text" class="form-control" id="productName" name="productName" placeholder="Enter product name" required>
            </div>

            <div class="mb-3">
              <label for="brand" class="form-label">Brand</label>
              <input type="text" class="form-control" id="brand" name="brand" placeholder="Enter brand name">
            </div>

            <div class="mb-3">
              <label for="price" class="form-label">Price (₹)</label>
              <input type="number" class="form-control" id="price" name="price" placeholder="Enter price" required>
            </div>
          </div>

          <!-- Dynamic Fields -->
          <div id="dynamicFields"></div>

          <div class="mb-3">
            <label for="image" class="form-label">Upload Image</label>
            <input type="file" class="form-control" id="image" name="image">
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary px-5">Add Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById("category").addEventListener("change", function() {
    const cat = this.value;
    const dynamic = document.getElementById("dynamicFields");
    dynamic.innerHTML = ""; // Clear previous fields

    if (cat === "storage") {
      dynamic.innerHTML = `
        <div class="mb-3">
          <label class="form-label">Storage Type</label>
          <select class="form-select" name="storage_type">
            <option value="HDD">HDD</option>
            <option value="SSD">SSD</option>
            <option value="NVMe">NVMe</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Capacity</label>
          <input type="text" class="form-control" name="capacity" placeholder="e.g., 1TB, 512GB">
        </div>`;
    }
    else if (cat === "cables") {
      dynamic.innerHTML = `
        <div class="mb-3">
          <label class="form-label">Cable Type</label>
          <input type="text" class="form-control" name="cable_type" placeholder="e.g., HDMI, USB, SATA">
        </div>
        <div class="mb-3">
          <label class="form-label">Length</label>
          <input type="text" class="form-control" name="length" placeholder="e.g., 1.5m">
        </div>`;
    }
    else if (cat === "processor") {
      dynamic.innerHTML = `
        <div class="mb-3">
          <label class="form-label">Cores/Threads</label>
          <input type="text" class="form-control" name="cores" placeholder="e.g., 6 Cores / 12 Threads">
        </div>
        <div class="mb-3">
          <label class="form-label">Clock Speed</label>
          <input type="text" class="form-control" name="clock_speed" placeholder="e.g., 3.5 GHz">
        </div>`;
    }
    else if (cat === "ram") {
      dynamic.innerHTML = `
        <div class="mb-3">
          <label class="form-label">Memory Size</label>
          <input type="text" class="form-control" name="memory_size" placeholder="e.g., 8GB, 16GB">
        </div>
        <div class="mb-3">
          <label class="form-label">Speed</label>
          <input type="text" class="form-control" name="speed" placeholder="e.g., 3200 MHz">
        </div>`;
    }
    else if (cat === "gpu") {
      dynamic.innerHTML = `
        <div class="mb-3">
          <label class="form-label">VRAM</label>
          <input type="text" class="form-control" name="vram" placeholder="e.g., 8GB GDDR6">
        </div>
        <div class="mb-3">
          <label class="form-label">Chipset</label>
          <input type="text" class="form-control" name="chipset" placeholder="e.g., NVIDIA RTX 3060">
        </div>`;
    }
  });
</script>
    </body>
