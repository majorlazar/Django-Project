	<style>
    body {
        font-size: 16px; /* Base font size */
        font-family: 'Raleway', sans-serif;
    }

    h2 {
        font-size: 32px;
        font-weight: 600;
    }

    h4 {
        font-size: 24px;
        font-weight: 500;
        margin-top: 20px;
        margin-bottom: 15px;
    }

    p, li, textarea, input {
        font-size: 16px;
    }

    .card p {
        margin-bottom: 8px;
    }

    .list-group-item {
        font-size: 16px;
    }

    .btn {
        font-size: 18px;
    }

    .filter-form {
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);

        margin-top: 30px;
        margin-bottom: 40px;
    }

    .card {
        border: none;
        border-radius: 15px;
        overflow: hidden;
    }

    .card-img-top {
        border-top-left-radius: 15px;
        border-top-right-radius: 15px;
    }

    .card-footer {
