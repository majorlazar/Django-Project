
<!doctype html>
<html lang="en">
<head>
	{% load static %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="author" content="Untree.co">
  <link rel="shortcut icon" href="favicon.png">

  <meta name="description" content="" />
  <meta name="keywords" content="bootstrap, bootstrap4" />

		<!-- Bootstrap CSS -->
		<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
		<link href="{% static 'css/tiny-slider.css' %}" rel="stylesheet">
		<link href="{% static 'css/style.css' %}" rel="stylesheet">
		<title>GadgetHive </title>
	</head>

	<body>

		<!-- Start Header/Navigation -->
		<nav class="custom-navbar navbar navbar navbar-expand-md navbar-dark bg-dark" arial-label="Furni navigation bar">

			<div class="container">
				<a class="navbar-brand" href="user_home">GadgetHive<span>.</span></a>

				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsFurni" aria-controls="navbarsFurni" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>

				<div class="collapse navbar-collapse" id="navbarsFurni">

  <!-- Left Side Nav Links -->
			  <ul class="custom-navbar-nav navbar-nav ms-auto mb-2 mb-md-0">
					<li><a class="nav-link" href="userhome">Home</a></li>
					<li><a class="nav-link" href="shop">Shop</a></li>

					<li><a class="nav-link" href="cart">Cart</a></li>
					<li><a class="nav-link" href="addproduct">Add Product</a></li>
				  <li><a class="nav-link" href="product_status">Product Status</a></li>
					<li><a class="nav-link" href="checkout">Checkout</a></li>
					<li><a class="nav-link" href="contact">Contact us</a></li>


                <li class="nav-item active">
					<a class="nav-link" href="profile"><img src="{% static 'images/user.svg' %}"></li>
              </ul>

  <!-- Right Side Icons -->
  <ul class="custom-navbar-cta navbar-nav mb-2 mb-md-0 ms-5">
    <li class="nav-item">
      <a class="nav-link" href="logout" title="Logout">
        <i class="fa fa-sign-out" style="font-size:24px; color:white;"></i>
      </a>
    </li>
  </ul>

</div>
            </div>

		</nav>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-dark text-white text-center py-3 rounded-top">
                    <h4 class="mb-0"><i class="fa fa-user-circle me-2"></i>Your Profile</h4>
                </div>

                <div class="card-body p-4">

                    <!-- SUCCESS MESSAGE -->
                    {% if messages %}
                        {% for msg in messages %}
                            <div class="alert alert-success">{{ msg }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <!-- NAME -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" name="Name" class="form-control"
                                   value="{{ user.Name }}" required>
                        </div>

                        <!-- EMAIL -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" name="Email" class="form-control"
                                   value="{{ user.Email }}" required>
                        </div>

                        <!-- PHONE -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Phone</label>
                            <input type="number" name="Phone" class="form-control"
                                   value="{{ user.Phone }}" required>
                        </div>

                        <!-- ADDRESS -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Address</label>
                            <input type="text" name="Address" class="form-control"
                                   value="{{ user.Address }}">
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Place</label>
                                <input type="text" name="Place" class="form-control"
                                       value="{{ user.Place }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">District</label>
                                <input type="text" name="District" class="form-control"
                                       value="{{ user.District }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">State</label>
                                <input type="text" name="State" class="form-control"
                                       value="{{ user.State }}">
                            </div>
                        </div>

                        <!-- USERNAME (read only) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control"
                                   value="{{ user.Username }}" readonly>
                        </div>

                        <!-- PASSWORD -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" name="Password" class="form-control"
                                   value="{{ user.Password }}" required>
                        </div>

                        <button class="btn btn-dark w-100 py-2">
                            <i class="fa fa-save me-2"></i> Update Profile
                        </button>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>




</body>
</html>
